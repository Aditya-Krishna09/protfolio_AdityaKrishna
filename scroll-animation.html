<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Scroll Animation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { min-height: 520vh; }
    canvas { position: sticky; top: 0; display: block; width: 100%; height: 100vh; height: 100svh; object-fit: contain; }
  </style>
</head>
<body>
  <canvas id="sequence" role="img" aria-label="Image sequence animation controlled by scrolling"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('sequence');
      const ctx = canvas.getContext('2d', { alpha: false });
      const count = 118;
      const frames = Array.from({ length: count }, (_, i) => {
        const image = new Image();
        image.src = `assets/scroll-sequence/ezgif-frame-${String(i + 1).padStart(3, '0')}.jpg`;
        return image;
      });
      let lastPosition = -1;
      let resizeQueued = false;

      function fit() {
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.round(canvas.clientWidth * scale);
        const height = Math.round(canvas.clientHeight * scale);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          lastPosition = -1;
        }
      }

      function paint() {
        resizeQueued = false;
        fit();
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const progress = maxScroll > 0 ? Math.max(0, Math.min(1, window.scrollY / maxScroll)) : 0;
        const framePosition = progress * (count - 1);
        const frameIndex = Math.floor(framePosition);
        if (Math.abs(framePosition - lastPosition) < 0.002 && frames[frameIndex].complete) return;
        const first = frames[frameIndex];
        const second = frames[Math.min(frameIndex + 1, count - 1)];
        if (!first.complete || !second.complete || !first.naturalWidth) {
          first.addEventListener('load', requestPaint, { once: true });
          return;
        }

        const w = canvas.width;
        const h = canvas.height;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        const draw = (image, alpha) => {
          const scale = Math.min(w / image.naturalWidth, h / image.naturalHeight);
          const dw = image.naturalWidth * scale;
          const dh = image.naturalHeight * scale;
          ctx.globalAlpha = alpha;
          ctx.drawImage(image, (w - dw) / 2, (h - dh) / 2, dw, dh);
        };
        draw(first, 1);
        draw(second, framePosition - frameIndex);
        ctx.globalAlpha = 1;
        lastPosition = framePosition;
      }

      function requestPaint() {
        if (!resizeQueued) {
          resizeQueued = true;
          requestAnimationFrame(paint);
        }
      }
      window.addEventListener('scroll', requestPaint, { passive: true });
      window.addEventListener('resize', requestPaint, { passive: true });
      frames[0].addEventListener('load', requestPaint, { once: true });
      requestPaint();
    })();
  </script>
</body>
</html>
